<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>班主任工作台 · 中高职版</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --sidebar: #fbfbfd;
  --primary: #1d1d1f;
  --accent: #0071e3;
  --accent-soft: #e8f1fc;
  --border: #d2d2d7;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --danger: #ff3b30;
  --success: #34c759;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.47;
  overflow: hidden;
}
/* ===== Topbar ===== */
.topbar {
  height: 52px;
  background: rgba(255,255,255,0.82);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 200;
}
.logo { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.class-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.class-select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-size: 13px;
  max-width: 160px;
  outline: none;
}
.teacher-info { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; align-items: center; }
.search-box {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 140px;
  font-size: 13px;
  background: #f5f5f7;
  outline: none;
}
.search-box:focus { border-color: var(--accent); background: #fff; }
/* ===== Buttons ===== */
.btn {
  padding: 7px 14px;
  border: none;
  border-radius: 980px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  background: var(--accent);
  color: #fff;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.88; }
.btn:active { opacity: 0.75; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover { background: #f5f5f7; }
.btn-danger { background: var(--danger); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--accent); border: none; }
/* ===== Layout ===== */
.main { display: flex; height: calc(100vh - 52px); height: calc(100dvh - 52px); }
.sidebar {
  width: 200px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 8px;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}
.nav-item {
  padding: 10px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-weight: 450;
  margin-bottom: 2px;
  transition: background 0.15s;
}
.nav-item:hover { background: #f0f0f2; }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 560;
}
.nav-icon { width: 22px; text-align: center; font-size: 16px; }
.workspace {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  -webkit-overflow-scrolling: touch;
}
/* ===== Cards & Tables ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 12px;
  margin-bottom: 8px;
}
.stat-item {
  background: #f5f5f7;
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
}
.stat-value { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
.stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
th { font-weight: 560; color: var(--text-secondary); font-size: 12px; background: #fafafa; position: sticky; top: 0; }
tr:hover td { background: #f9f9fb; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 48px 20px; color: var(--text-secondary); font-size: 14px; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
/* ===== Modal ===== */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  padding: 0;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.12);
}
@media (min-width: 640px) {
  .modal-mask { align-items: center; padding: 20px; }
  .modal { border-radius: 16px; max-height: 85vh; }
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 16px;
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
}
.modal-body { padding: 18px 20px; }
.modal-footer {
  padding: 12px 20px 20px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  position: sticky;
  bottom: 0;
  background: var(--card);
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  margin-bottom: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  background: #fff;
  outline: none;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.close-btn {
  background: #f5f5f7;
  border: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
}
.toast {
  position: fixed;
  bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(29,29,31,0.92);
  color: #fff;
  padding: 10px 20px;
  border-radius: 980px;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s;
  font-size: 14px;
  pointer-events: none;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ===== Seat ===== */
.seat-grid { display: grid; gap: 6px; margin: 12px 0; }
.seat-cell {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 4px;
  text-align: center;
  min-height: 44px;
  background: #fff;
  cursor: grab;
  font-size: 12px;
  font-weight: 500;
  user-select: none;
}
.seat-cell.empty { background: #f5f5f7; color: #aeaeb2; }
.tag {
  display: inline-block;
  padding: 5px 12px;
  margin: 3px;
  border-radius: 980px;
  background: #f5f5f7;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.tag.selected { background: var(--accent); color: #fff; }
.schedule-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.schedule-table th, .schedule-table td {
  border: 1px solid var(--border);
  padding: 8px 4px;
  text-align: center;
  min-width: 68px;
}
.schedule-table th { background: #f5f5f7; font-weight: 560; }
/* ===== Mobile Bottom Nav ===== */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 150;
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.mobile-nav-item {
  flex: 1;
  text-align: center;
  padding: 6px 0;
  font-size: 10px;
  color: var(--text-secondary);
  cursor: pointer;
}
.mobile-nav-item.active { color: var(--accent); font-weight: 600; }
.mobile-nav-item span { display: block; font-size: 20px; margin-bottom: 1px; }
.menu-btn {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  padding: 4px 8px;
  cursor: pointer;
}
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 180;
}
/* ===== Responsive ===== */
@media (max-width: 860px) {
  .sidebar {
    position: fixed;
    left: 0; top: 52px; bottom: 0;
    z-index: 190;
    transform: translateX(-100%);
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.show { display: block; }
  .menu-btn { display: block; }
  .teacher-info { display: none; }
  .search-box { width: 100px; }
  .workspace { padding: 14px 12px 70px; }
  .mobile-nav { display: flex; }
  .form-row { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .top-actions .btn-outline:not(:first-child) { display: none; }
}
@media (max-width: 480px) {
  .logo { font-size: 15px; }
  .class-select { max-width: 110px; font-size: 12px; }
  .search-box { width: 80px; padding: 6px 8px; }
}
/* Print seat table */
@media print {
  .topbar, .sidebar, .mobile-nav, .toolbar, .btn { display: none !important; }
  .workspace { padding: 0; }
  body { overflow: visible; }
}
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()" aria-label="菜单">☰</button>
  <div class="logo">班主任工作台</div>
  <div class="class-info">
    <select id="classSelect" class="class-select" onchange="switchClass(this.value)"></select>
    <span class="teacher-info" id="teacherInfo">—</span>
  </div>
  <div class="top-actions">
    <input type="text" class="search-box" id="globalSearch" placeholder="搜索学生" oninput="doGlobalSearch(this.value)">
    <button class="btn btn-outline btn-sm" onclick="showExportCenter()">导出</button>
    <button class="btn btn-outline btn-sm" onclick="backupData()">备份</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('restoreInput').click()">恢复</button>
    <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreData(event)">
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="nav-item active" data-module="dashboard" onclick="switchModule('dashboard')"><span class="nav-icon">📊</span> 仪表盘</div>
    <div class="nav-item" data-module="class" onclick="switchModule('class')"><span class="nav-icon">🏫</span> 班级管理</div>
    <div class="nav-item" data-module="schedule" onclick="switchModule('schedule')"><span class="nav-icon">📅</span> 课程表</div>
    <div class="nav-item" data-module="students" onclick="switchModule('students')"><span class="nav-icon">👥</span> 学生管理</div>
    <div class="nav-item" data-module="scores" onclick="switchModule('scores')"><span class="nav-icon">📝</span> 成绩管理</div>
    <div class="nav-item" data-module="seats" onclick="switchModule('seats')"><span class="nav-icon">🪑</span> 座位管理</div>
    <div class="nav-item" data-module="dorms" onclick="switchModule('dorms')"><span class="nav-icon">🛏️</span> 宿舍管理</div>
    <div class="nav-item" data-module="points" onclick="switchModule('points')"><span class="nav-icon">⭐</span> 积分管理</div>
    <div class="nav-item" data-module="comments" onclick="switchModule('comments')"><span class="nav-icon">💬</span> 学生评语</div>
    <div class="nav-item" data-module="records" onclick="switchModule('records')"><span class="nav-icon">📂</span> 工作留痕</div>
    <div class="nav-item" data-module="todos" onclick="switchModule('todos')"><span class="nav-icon">✅</span> 待办事项</div>
    <div class="nav-item" data-module="custom" onclick="switchModule('custom')"><span class="nav-icon">➕</span> 自定义</div>
  </div>
  <div class="workspace" id="workspace"></div>
</div>
<!-- Mobile bottom nav (core 5) -->
<nav class="mobile-nav" id="mobileNav">
  <div class="mobile-nav-item active" data-module="dashboard" onclick="switchModule('dashboard')"><span>📊</span>首页</div>
  <div class="mobile-nav-item" data-module="students" onclick="switchModule('students')"><span>👥</span>学生</div>
  <div class="mobile-nav-item" data-module="scores" onclick="switchModule('scores')"><span>📝</span>成绩</div>
  <div class="mobile-nav-item" data-module="seats" onclick="switchModule('seats')"><span>🪑</span>座位</div>
  <div class="mobile-nav-item" data-module="more" onclick="toggleSidebar(true)"><span>☰</span>更多</div>
</nav>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-header"><span id="modalTitle">标题</span><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
window.XLSX_LOADED = false;
</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"
  onload="window.XLSX_LOADED=true"
  onerror="console.warn('SheetJS CDN 加载失败，将使用纯CSV导入导出')"></script>

<script>
/* =========================================================
   班主任工作台 · 中高职版 v3
   面向中等/高等职业学校 · 移动优先 · 极简风格
   ========================================================= */
const STORAGE_KEY = 'vocational_teacher_workbench_v3';
const APP_VERSION = 3;
let appData = null;
let currentModule = 'dashboard';
let _stuKeyword = '';
let dragSrc = null;

function createDefaultData() {
  const classId = 'class_001';
  const students = generateSampleStudents();
  return {
    version: APP_VERSION,
    currentClassId: classId,
    classes: {
      [classId]: {
        id: classId,
        name: '25级机电一体化1班',
        grade: '中职二年级',
        teacherName: '李明华',
        subject: '机电专业',
        classroom: '实训楼B201',
        schoolYear: '2025-2026',
        culture: {
          slogan: '精技立身 · 厚德笃行',
          motto: '德技并修，工学结合',
          rules: '遵守实训安全规范，按时完成任务，互助共进',
          monthlyTheme: '技能提升月',
          description: '本班以培养高素质技术技能人才为目标。'
        },
        teachers: [
          { id: 't1', name: '王芳', subject: '机械制图', duty: '专业课', phone: '13800001111' },
          { id: 't2', name: '赵强', subject: '电工电子', duty: '专业课', phone: '13900002222' },
          { id: 't3', name: '陈静', subject: '语文', duty: '文化课', phone: '13700003333' }
        ],
        cadres: [
          { id: 'c1', title: '班长', studentId: students[0].id },
          { id: 'c2', title: '学习委员', studentId: students[1].id },
          { id: 'c3', title: '实训安全员', studentId: students[2].id }
        ],
        groups: [{ id: 'g1', name: '第一实训组', leaderId: students[0].id, memberIds: students.slice(0,5).map(s=>s.id) }],
        students,
        schedule: {
          days: ['周一','周二','周三','周四','周五'],
          periods: [
            { id:'p0', name:'早读', start:'07:30', end:'07:50' },
            { id:'p1', name:'第1节', start:'08:00', end:'08:45' },
            { id:'p2', name:'第2节', start:'08:55', end:'09:40' },
            { id:'p3', name:'第3节', start:'10:00', end:'10:45' },
            { id:'p4', name:'第4节', start:'10:55', end:'11:40' },
            { id:'p5', name:'第5节', start:'14:00', end:'14:45' },
            { id:'p6', name:'第6节', start:'14:55', end:'15:40' },
            { id:'p7', name:'第7节', start:'16:00', end:'16:45' }
          ],
          bigBreakAfter: 2,
          cells: {}
        },
        exams: [],
        scores: {},
        seats: { mode: 'group', config: { groups: 4, colsPerGroup: 2, rows: 5, podiumTop: true }, versions: [], current: {} },
        dorms: { male: [], female: [], scores: [] },
        points: [],
        comments: [],
        records: [],
        todos: [{ id: 'todo1', title: '组织第一次实训安全教育', deadline: '2026-08-25', priority: '紧急', done: false, remind: true }],
        customModules: []
      }
    }
  };
}

function generateSampleStudents() {
  const surnames = '张王李赵刘陈杨黄周吴徐孙马朱胡郭何高林罗'.split('');
  const names = '伟芳娜敏静丽强磊军洋勇艳杰涛超秀英霞平刚桂英'.split('');
  const list = [];
  for (let i = 1; i <= 40; i++) {
    const gender = i % 3 === 0 ? '女' : '男';
    list.push({
      id: 'stu_' + String(i).padStart(3,'0'),
      name: surnames[i % surnames.length] + names[(i*3) % names.length],
      gender,
      birthday: `2007-${String((i%12)+1).padStart(2,'0')}-${String((i%28)+1).padStart(2,'0')}`,
      studentId: '2025' + String(i).padStart(4,'0'),
      classNo: String(i).padStart(2,'0'),
      examNo: 'E' + String(i).padStart(4,'0'),
      ticketNo: '',
      guardian: '家长',
      phone: '138' + String(10000000 + i*117).slice(0,8),
      address: '本市某街道' + i + '号',
      special: i%10===0 ? '近视' : (i%15===0 ? '单亲' : ''),
      position: '',
      groupId: '',
      dormBed: '',
      moralScore: 90 + (i % 11),
      attendance: 98,
      major: '机电一体化',
      extra: {}
    });
  }
  return list;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { appData = createDefaultData(); saveData(); return; }
    appData = JSON.parse(raw);
    if (!appData.version || appData.version < APP_VERSION) {
      appData.version = APP_VERSION;
      // 温和迁移，不清空
      saveData();
    }
  } catch (e) {
    console.error(e);
    appData = createDefaultData();
    saveData();
  }
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
  catch (e) { toast('保存失败，存储空间可能已满'); }
}
function getCurrentClass() { return appData.classes[appData.currentClassId]; }
function toast(msg, t = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), t);
}
function uid(p = 'id') { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function confirmDel(msg) { return confirm(msg || '确定删除？此操作不可恢复。'); }

function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer || '';
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
  document.body.style.overflow = '';
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  const open = force === true ? true : force === false ? false : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

function refreshClassSelect() {
  const sel = document.getElementById('classSelect');
  sel.innerHTML = '';
  Object.values(appData.classes).forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    if (c.id === appData.currentClassId) o.selected = true;
    sel.appendChild(o);

  document.getElementById('teacherInfo').textContent =
    `${cls.teacherName || '—'} · ${cls.subject || '—'}`;

function switchModule(mod) {
  if (mod === 'more') { toggleSidebar(true); return; }
  currentModule = mod;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.module === mod));
  document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.toggle('active', el.dataset.module === mod));
  toggleSidebar(false);
  const map = {
    dashboard: renderDashboard, class: renderClass, schedule: renderSchedule,
    students: renderStudents, scores: renderScores, seats: renderSeats,
    dorms: renderDorms, points: renderPoints, comments: renderComments,

  };

    subject: document.getElementById('tSubject').value.trim(),

  };

function renderSchedule() {
  const cls = getCurrentClass();
  const sch = cls.schedule;
  let html = `<div class="card"><div class="card-title">课程表
    <button class="btn btn-sm btn-outline" onclick="editPeriods()">管理时段</button></div>
    <div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>时段</th>`;
  sch.days.forEach(d => html += `<th>${d}</th>`);
  html += `</tr></thead><tbody>`;
  sch.periods.forEach((p, pi) => {
    html += `<tr><td><b>${p.name}</b><br><small style="color:#86868b">${p.start}-${p.end}</small></td>`;
    sch.days.forEach(d => {
      const key = d + '-' + p.id;
      const cell = sch.cells[key] || {};
      html += `<td style="cursor:pointer" onclick="editCell('${key}')">${cell.subject||''}<br><small style="color:#86868b">${cell.teacher||''}</small></td>`;
    });
    html += `</tr>`;
    if (pi === sch.bigBreakAfter) {
      html += `<tr><td colspan="${sch.days.length+1}" style="background:#f0f7ff;color:#0071e3;text-align:center;font-size:12px">大课间</td></tr>`;
    }
  });
  html += `</tbody></table></div></div>`;
  document.getElementById('workspace').innerHTML = html;
}

      <input value="${p.start}" type="time" style="width:90px">

  openModal('管理时段', `

function addPeriodRow() {
  const div = document.createElement('div');
  div.className = 'form-row';
  div.style.marginBottom = '8px';
  div.innerHTML = `<input placeholder="名称" style="width:70px"><input type="time" style="width:90px"><input type="time" style="width:90px">
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">删</button>`;

function savePeriods() {
  const list = document.getElementById('periodList');
  const periods = [];
  list.querySelectorAll('.form-row').forEach((row, i) => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0] && inputs[0].value.trim()) {
      periods.push({
        id: 'p' + i,
        name: inputs[0].value.trim(),
        start: inputs[1].value,
        end: inputs[2].value
      });
    }
  });
  const sch = getCurrentClass().schedule;
  sch.periods = periods;
  sch.bigBreakAfter = parseInt(document.getElementById('bigBreak').value) || 2;

function saveStudent(id) {

  const data = {
    name,
    gender: document.getElementById('sGender').value,
    classNo: document.getElementById('sClassNo').value.trim(),

    birthday: document.getElementById('sBirthday').value,

  };

  } else {
    data.id = uid('stu');

    data.attendance = 100;
    data.extra = {};
    cls.students.push(data);
  }
  saveData(); closeModal(); renderStudents(); toast('已保存');
}

function viewExamScores(examId) {
  const cls = getCurrentClass();
  const exam = cls.exams.find(e => e.id === examId);
  const scoreMap = cls.scores[examId] || {};
  let html = `<div class="card"><div class="card-title">${exam.name}
    <div>
      <button class="btn btn-sm btn-outline" onclick="exportExamXlsx('${examId}')">导出明细</button>

      <button class="btn btn-sm btn-ghost" onclick="renderScores()">返回</button>
    </div></div>`;
  if (Object.keys(scoreMap).length === 0) {
    html += '<div class="empty">暂无成绩，请先导入</div>';
  } else {
    const subjects = new Set();
    Object.values(scoreMap).forEach(sc =>
      Object.keys(sc).forEach(k => { if (!['total','rank','avg'].includes(k)) subjects.add(k); })
    );
    const subList = [...subjects];
    html += `<div style="overflow-x:auto"><table><thead><tr><th>姓名</th><th>学号</th>`;
    subList.forEach(s => html += `<th>${s}</th>`);
    html += `<th>总分</th></tr></thead><tbody>`;
    cls.students.forEach(stu => {
      const sc = scoreMap[stu.id] || {};
      html += `<tr><td>${stu.name}</td><td>${stu.classNo||''}</td>`;
      subList.forEach(s => html += `<td>${sc[s] ?? ''}</td>`);
      html += `<td>${sc.total ?? ''}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  document.getElementById('workspace').innerHTML = html;

function exportExamXlsx(examId) {
  if (!window.XLSX_LOADED) return toast('请联网加载SheetJS后重试，或使用CSV导出');
  const cls = getCurrentClass();
  const exam = cls.exams.find(e => e.id === examId);
  const scoreMap = cls.scores[examId] || {};
  const subjects = new Set();
  Object.values(scoreMap).forEach(sc =>
    Object.keys(sc).forEach(k => { if (!['total','rank','avg'].includes(k)) subjects.add(k); })
  );
  const subList = [...subjects];
  const data = [['姓名','学号',...subList,'总分']];
  cls.students.forEach(stu => {
    const sc = scoreMap[stu.id] || {};
    data.push([stu.name, stu.classNo||'', ...subList.map(s => sc[s]??''), sc.total??'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '成绩明细');
  XLSX.writeFile(wb, `${cls.name}_${exam.name}_成绩.xlsx`);
  toast('已导出');
}
/** 多工作表完整分析报告 */
function exportFullAnalysis(examId) {
  if (!window.XLSX_LOADED) return toast('需要联网加载SheetJS才能生成多工作表报告');
  const cls = getCurrentClass();
  const exam = cls.exams.find(e => e.id === examId);
  const scoreMap = cls.scores[examId] || {};
  const subjects = new Set();
  Object.values(scoreMap).forEach(sc =>
    Object.keys(sc).forEach(k => { if (!['total','rank','avg'].includes(k)) subjects.add(k); })
  );
  const subList = [...subjects];
  const wb = XLSX.utils.book_new();

  // 1. 综合概览
  const overview = [
    ['班级', cls.name],
    ['考试', exam.name],
    ['日期', exam.date || ''],
    ['类型', exam.type || ''],
    ['参考人数', Object.keys(scoreMap).length],
    [],
    ['学科', '平均分', '最高分', '最低分', '及格率']
  ];
  subList.forEach(sub => {
    const vals = cls.students.map(s => parseFloat(scoreMap[s.id]?.[sub])).filter(v => !isNaN(v));
    if (!vals.length) return;
    const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const max = Math.max(...vals);
    const min = Math.min(...vals);
    const pass = (vals.filter(v=>v>=60).length / vals.length * 100).toFixed(1) + '%';
    overview.push([sub, avg, max, min, pass]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overview), '综合概览');

  // 2. 成绩明细
  const detail = [['姓名','学号',...subList,'总分']];
  cls.students.forEach(stu => {
    const sc = scoreMap[stu.id] || {};
    detail.push([stu.name, stu.classNo||'', ...subList.map(s=>sc[s]??''), sc.total??'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), '成绩明细');

  // 3. 学科分析
  subList.forEach(sub => {
    const rows = [['姓名','学号',sub,'等级']];
    cls.students.forEach(stu => {
      const v = scoreMap[stu.id]?.[sub];
      let level = '';
      if (v !== undefined && v !== '') {
        const n = parseFloat(v);
        if (!isNaN(n)) level = n>=90?'优秀':n>=80?'良好':n>=60?'及格':'待提高';
        else level = String(v);
      }
      rows.push([stu.name, stu.classNo||'', v??'', level]);
    });
    const sheetName = sub.length > 8 ? sub.slice(0,8) : sub;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });

  // 4. 教学建议
  const advice = [
    ['教学建议'],
    [''],
    ['1. 关注平均分较低的学科，加强薄弱环节辅导。'],
    ['2. 对特殊关注学生进行个别谈心与学习指导。'],
    ['3. 结合实训与理论成绩，评估学生综合职业能力。'],
    ['4. 建议组织优秀学生经验分享，带动整体进步。']
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(advice), '教学建议');

  XLSX.writeFile(wb, `${cls.name}_${exam.name}_完整分析报告.xlsx`);
  toast('多工作表分析报告已导出');
}

        <label style="font-size:13px">排数 <input type="number" id="cfgRows" value="${cfg.rows||5}" min="1" max="12" style="width:48px;padding:4px;border-radius:6px;border:1px solid var(--border)"></label>
        <label style="font-size:13px">

          ${cls.students.filter(s => !Object.values(seat.current||{}).includes(s.id))
            .map(s => `<span class="seat-cell" draggable="true" ondragstart="dragStart(event,'${s.id}')" style="padding:6px 10px;min-height:auto">${s.name}</span>`)
            .join('') || '<span style="color:#aeaeb2;font-size:13px">全部已入座</span>'}

function renderSeatGrid() {
  const cls = getCurrentClass();
  const seat = cls.seats;
  const cfg = seat.config || { groups:4, colsPerGroup:2, rows:5, podiumTop:true, showNo:false };
  const current = seat.current || {};
  const showNo = !!cfg.showNo;
  const podiumTop = cfg.podiumTop !== false;

  const podiumHtml = `<div style="text-align:center;margin:10px auto;padding:8px 24px;border:1px solid var(--border);border-radius:8px;background:#f5f5f7;font-weight:600;font-size:13px;max-width:280px">讲　台</div>`;

  let html = '';
  if (podiumTop) html += podiumHtml;

  if (seat.mode === 'group') {
    // 两端分散 + 居中：space-evenly 让各组均匀铺满，页面更满、更均衡
    html += `<div style="display:flex;justify-content:space-evenly;align-items:flex-start;flex-wrap:nowrap;gap:8px;width:100%;overflow-x:auto;padding:4px 0">`;
    for (let g = 0; g < cfg.groups; g++) {
      html += `<div style="flex:0 0 auto">
        <div style="text-align:center;margin-bottom:6px;font-weight:600;font-size:12px;color:var(--text-secondary)">第${g+1}组</div>
        <div class="seat-grid" style="grid-template-columns:repeat(${cfg.colsPerGroup},64px);gap:5px">`;
      for (let r = 0; r < cfg.rows; r++) {
        for (let c = 0; c < cfg.colsPerGroup; c++) {
          const key = `g${g}-r${r}-c${c}`;
          const sid = current[key];
          const stu = sid ? cls.students.find(s => s.id === sid) : null;
          const label = stu
            ? (showNo && stu.classNo ? `${stu.name}<br><small style="color:#86868b">${stu.classNo}</small>` : stu.name)
            : '空';
          html += `<div class="seat-cell ${stu?'':'empty'}" draggable="${!!stu}"
            ondragstart="dragStart(event,'${sid||''}','${key}')"
            ondragover="event.preventDefault()" ondrop="dropSeat(event,'${key}')"
            style="line-height:1.25">${label}</div>`;
        }
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="seat-grid" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-width:560px;margin:0 auto">`;
    for (let i = 0; i < 40; i++) {
      const key = 's' + i;
      const sid = current[key];
      const stu = sid ? cls.students.find(s => s.id === sid) : null;
      const label = stu
        ? (showNo && stu.classNo ? `${stu.name}<br><small style="color:#86868b">${stu.classNo}</small>` : stu.name)
        : '空';
      html += `<div class="seat-cell ${stu?'':'empty'}" draggable="${!!stu}"
        ondragstart="dragStart(event,'${sid||''}','${key}')"
        ondragover="event.preventDefault()" ondrop="dropSeat(event,'${key}')"
        style="line-height:1.25">${label}</div>`;
    }
    html += `</div>`;
  }

  if (!podiumTop) html += podiumHtml;
  return html;
}
function dragStart(e, sid, key) {
  dragSrc = { sid, key };
  e.dataTransfer.effectAllowed = 'move';
}
function dropSeat(e, targetKey) {
  e.preventDefault();
  if (!dragSrc) return;
  const seat = getCurrentClass().seats;
  if (!seat.current) seat.current = {};
  if (dragSrc.key) {
    const temp = seat.current[targetKey];
    seat.current[targetKey] = dragSrc.sid;
    if (temp) seat.current[dragSrc.key] = temp;
    else delete seat.current[dragSrc.key];
  } else {
    seat.current[targetKey] = dragSrc.sid;
  }
  dragSrc = null;
  saveData();
  renderSeats();
}
function changeSeatMode(mode) {
  getCurrentClass().seats.mode = mode;
  saveData();
  renderSeats();
}
function applySeatConfig() {
  const cfg = getCurrentClass().seats.config || {};
  cfg.groups = parseInt(document.getElementById('cfgGroups').value) || 4;
  cfg.colsPerGroup = parseInt(document.getElementById('cfgCols').value) || 2;
  cfg.rows = parseInt(document.getElementById('cfgRows').value) || 5;
  cfg.podiumTop = document.getElementById('cfgPodium').value === 'top';
  cfg.showNo = document.getElementById('cfgShowNo').checked;
  getCurrentClass().seats.config = cfg;
  saveData();
  renderSeats();
  toast('布局已更新');
}
function saveSeatVersion() {
  const seat = getCurrentClass().seats;
  seat.versions = seat.versions || [];
  seat.versions.push({
    id: uid('sv'),
    time: new Date().toLocaleString('zh-CN'),
    data: JSON.parse(JSON.stringify(seat.current || {}))
  });
  saveData();
  toast('版本已保存');
}
function autoArrangeSeats() {
  const cls = getCurrentClass();
  const students = [...cls.students].sort((a,b) => (b.moralScore||0) - (a.moralScore||0));
  const seat = cls.seats;
  const cfg = seat.config || { groups:4, colsPerGroup:2, rows:5 };
  seat.current = {};
  let idx = 0;
  for (let g = 0; g < cfg.groups && idx < students.length; g++) {
    for (let r = 0; r < cfg.rows && idx < students.length; r++) {
      for (let c = 0; c < cfg.colsPerGroup && idx < students.length; c++) {
        seat.current[`g${g}-r${r}-c${c}`] = students[idx++].id;
      }
    }
  }
  saveData();
  renderSeats();
  toast('已按德育分初步排座');
}

/** 正式横向座位表导出：Word（均衡铺满） / Excel */
function exportSeatTable(format) {
  format = format || 'word';
  const cls = getCurrentClass();
  const seat = cls.seats;
  const current = seat.current || {};
  const cfg = seat.config || { groups: 4, colsPerGroup: 2, rows: 5, podiumTop: true, showNo: false };
  const dateStr = new Date().toLocaleDateString('zh-CN');
  const showNo = !!cfg.showNo;
  const podiumTop = cfg.podiumTop !== false;
  const male = cls.students.filter(s => s.gender === '男').length;
  const female = cls.students.length - male;

  // 矩阵：每行 = 各组座位（含学生对象）
  const matrix = [];
  for (let r = 0; r < cfg.rows; r++) {
    const line = [];
    for (let g = 0; g < cfg.groups; g++) {
      for (let c = 0; c < cfg.colsPerGroup; c++) {
        const key = `g${g}-r${r}-c${c}`;
        const sid = current[key];
        const stu = sid ? cls.students.find(s => s.id === sid) : null;
        line.push(stu);
      }
    }
    matrix.push(line);
  }

  if (format === 'excel') {
    if (!window.XLSX_LOADED) {
      toast('SheetJS未加载，改为导出Word');
      return exportSeatTable('word');
    }
    const rows = [
      [`${cls.name} 座位表`],
      [`班主任：${cls.teacherName || ''}　教室：${cls.classroom || ''}　${dateStr}`],
      [],
      podiumTop ? ['【讲台】'] : []
    ];
    // 组标题
    const gh = [];
    for (let g = 0; g < cfg.groups; g++) {
      for (let c = 0; c < cfg.colsPerGroup; c++) gh.push(c === 0 ? `第${g+1}组` : '');
      if (g < cfg.groups - 1) gh.push('');
    }
    rows.push(gh);
    matrix.forEach(line => {
      const row = [];
      for (let g = 0; g < cfg.groups; g++) {
        for (let c = 0; c < cfg.colsPerGroup; c++) {
          const stu = line[g * cfg.colsPerGroup + c];
          row.push(stu ? (showNo && stu.classNo ? `${stu.name}(${stu.classNo})` : stu.name) : '');
        }
        if (g < cfg.groups - 1) row.push('｜');
      }
      rows.push(row);
    });
    if (!podiumTop) rows.push(['【讲台】']);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '座位表');
    XLSX.writeFile(wb, `${cls.name}_座位表.xlsx`);
    toast('座位表已导出为 Excel');
    return;
  }

  // ===== Word：整表居中 + 组间过道 + 均匀铺满页面 =====
  const aisleW = 22; // 过道列宽
  const cellW = 72;

  function cellHtml(stu) {
    if (!stu) {
      return `<td style="border:1px solid #999;text-align:center;vertical-align:middle;width:${cellW}px;height:38px;font-size:11pt;color:#bbb;">　</td>`;
    }
    const no = showNo && stu.classNo ? `<div style="font-size:9pt;color:#666;margin-top:1px;">${stu.classNo}</div>` : '';
    return `<td style="border:1px solid #333;text-align:center;vertical-align:middle;width:${cellW}px;height:38px;font-size:12pt;padding:4px 2px;">
      <div style="font-weight:500;">${stu.name}</div>${no}
    </td>`;
  }

  let tableRows = '';
  // 组标题行
  let gh = '<tr>';
  for (let g = 0; g < cfg.groups; g++) {
    gh += `<td colspan="${cfg.colsPerGroup}" style="border:1px solid #333;text-align:center;font-weight:bold;background:#e8e8e8;padding:5px 4px;font-size:10.5pt;">第${g + 1}组</td>`;
    if (g < cfg.groups - 1) gh += `<td style="border:none;width:${aisleW}px;"></td>`;
  }
  gh += '</tr>';
  tableRows += gh;

  matrix.forEach(line => {
    let tr = '<tr>';
    for (let g = 0; g < cfg.groups; g++) {
      for (let c = 0; c < cfg.colsPerGroup; c++) {
        tr += cellHtml(line[g * cfg.colsPerGroup + c]);
      }
      if (g < cfg.groups - 1) tr += `<td style="border:none;width:${aisleW}px;background:#fafafa;"></td>`;
    }
    tr += '</tr>';
    tableRows += tr;
  });

  const podiumBlock = `<div class="podium">讲　　台</div>`;
  const infoLine = `班主任：${cls.teacherName || '—'}　　教室：${cls.classroom || '—'}　　${dateStr}`;
  const footerLine = `共 ${cls.students.length} 人（男 ${male} / 女 ${female}）　·　由「班主任工作台」生成`;

  const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:w="urn:schemas-microsoft-com:office:word"
 xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<meta name="ProgId" content="Word.Document">
<!--[if gte mso 9]>
<xml>
  <w:WordDocument>
    <w:View>Print</w:View>
    <w:Zoom>100</w:Zoom>
    <w:DoNotOptimizeForBrowser/>
  </w:WordDocument>
</xml>
<![endif]-->
<style>
  @page { size: A4 landscape; margin: 1.2cm 1.2cm 1.2cm 1.2cm; }
  body { font-family: "宋体","SimSun","Microsoft YaHei",sans-serif; font-size: 12pt; }
  h1 { text-align: center; font-size: 18pt; font-family: "黑体","SimHei","Microsoft YaHei",sans-serif; margin: 4pt 0 6pt 0; letter-spacing: 2px; }
  .info { text-align: center; font-size: 10.5pt; margin-bottom: 8pt; color: #333; }
  .podium {
    text-align: center; font-size: 11pt; font-weight: bold;
    border: 1.5px solid #333; padding: 5pt 0; margin: 6pt auto 10pt auto;
    width: 36%; background: #f0f0f0; letter-spacing: 8px;
  }
  table.seat { border-collapse: collapse; margin: 0 auto; }
  .footer { text-align: center; font-size: 9pt; color: #666; margin-top: 10pt; }
</style>
</head>
<body>
  <h1>${cls.name}　座位表</h1>
  <div class="info">${infoLine}</div>
  ${podiumTop ? podiumBlock : ''}
  <table class="seat" cellspacing="0" cellpadding="0">
    ${tableRows}
  </table>
  ${!podiumTop ? podiumBlock : ''}
  <div class="footer">${footerLine}</div>
</body>
</html>`;

  const blob = new Blob(['\ufeff' + wordHtml], { type: 'application/msword;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${cls.name}_座位表.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Word座位表已下载（横向打印，组间均匀分布）');
}

  openModal('添加记录', `
    <div class="form-group"><label>内容</label><textarea id="crContent" rows="3"></textarea></div>`, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn" onclick="saveCustomRecord('${mid}')">保存</button>`);
}
function saveCustomRecord(mid) {
  const content = document.getElementById('crContent').value.trim();
  if (!content) return toast('请输入内容');
  const m = getCurrentClass().customModules.find(x => x.id === mid);
  if (m) {
    m.records = m.records || [];
    m.records.push({ id: uid('cr'), content, time: new Date().toLocaleString('zh-CN') });
    saveData(); closeModal(); renderCustom();
  }
}
function delCustomRecord(mid, rid) {
  const m = getCurrentClass().customModules.find(x => x.id === mid);
  if (m) {
    m.records = m.records.filter(r => r.id !== rid);
    saveData(); renderCustom();
  }
}

/* ========== 自适应导入引擎（CSV 优先 + XLSX） ========== */
function showSmartImport(type = 'student') {
  openModal('智能导入', `
    <p style="margin-bottom:12px;color:var(--text-secondary);font-size:13px;line-height:1.5">
      支持 <b>CSV</b>（离线可用）和 <b>Excel (.xlsx/.xls)</b>（需联网加载组件）。<br>
      自动识别表头，不要求第一行，支持常见中文别名。
    </p>
    <input type="file" id="importFile" accept=".csv,.xlsx,.xls,text/csv">
    <p style="margin-top:10px;font-size:12px;color:#86868b">
      当前重点：学生名单、成绩表。导入后会显示识别结果。
    </p>`, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn" onclick="doSmartImport('${type}')">开始导入</button>`);
}
function doSmartImport(type) {
  const file = document.getElementById('importFile').files[0];
  if (!file) return toast('请先选择文件');
  const name = file.name.toLowerCase();
  const isCsv = name.endsWith('.csv') || file.type === 'text/csv';

  if (isCsv) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        let text = e.target.result;
        // 处理 UTF-8 BOM
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const rows = parseCSV(text);
        if (type === 'student') importStudents(rows);
        else if (type === 'score') importScores(rows);
        else toast('该类型请优先使用学生或成绩导入');
      } catch (err) {
        toast('CSV解析失败：' + err.message);
      }
    };
    // 中文兼容：优先 UTF-8
    reader.readAsText(file, 'UTF-8');
  } else {
    if (!window.XLSX_LOADED) {
      return toast('Excel需要联网加载组件，或请先另存为CSV后导入');
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', codepage: 936 }); // 尝试中文代码页
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (type === 'student') importStudents(rows);
        else if (type === 'score') importScores(rows);
        else toast('已读取工作表，当前以学生/成绩导入为主');
      } catch (err) {
        toast('Excel解析失败：' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }
}
/** 简易健壮CSV解析（支持引号、中文） */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQuote = false;
      } else cell += ch;
    } else {
      if (ch === '"') inQuote = true;
      else if (ch === ',' || ch === '\t') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(c => c.trim())) rows.push(row);
        row = [];
      } else cell += ch;
    }
  }
  if (cell || row.length) { row.push(cell); if (row.some(c => c.trim())) rows.push(row); }
  return rows;
}
function findHeaderRow(rows, aliases) {
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    const row = (rows[i] || []).map(c => String(c || '').trim());
    let score = 0;
    for (const arr of Object.values(aliases)) {
      if (row.some(c => arr.includes(c))) score++;
    }
    if (score >= 1) return i;
  }
  return 0;
}
function importStudents(rows) {
  const aliases = {
    name: ['姓名','学生姓名','名字','学生'],
    classNo: ['学号','班内学号','编号'],
    studentId: ['学籍号','学籍','学籍编号'],
    gender: ['性别'],
    phone: ['电话','联系电话','手机','手机号'],
    guardian: ['监护人','家长','家长姓名'],
    special: ['特殊情况','备注','特殊']
  };
  const headerRow = findHeaderRow(rows, aliases);
  const headers = (rows[headerRow] || []).map(c => String(c || '').trim());
  const map = {};
  headers.forEach((h, i) => {
    for (const [k, arr] of Object.entries(aliases)) {
      if (arr.includes(h)) map[k] = i;
    }
  });
  if (map.name === undefined) {
    closeModal();
    return toast('未识别到「姓名」列，请检查表头');
  }
  const cls = getCurrentClass();
  let created = 0, updated = 0;
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[map.name]) continue;
    const name = String(row[map.name]).trim();
    if (!name) continue;
    let stu = cls.students.find(s =>
      s.name === name ||
      (map.studentId !== undefined && s.studentId === String(row[map.studentId] || '').trim())
    );
    const data = {
      name,
      classNo: map.classNo !== undefined ? String(row[map.classNo] || '').trim() : '',
      studentId: map.studentId !== undefined ? String(row[map.studentId] || '').trim() : '',
      gender: map.gender !== undefined ? String(row[map.gender] || '男').trim() : '男',
      phone: map.phone !== undefined ? String(row[map.phone] || '').trim() : '',
      guardian: map.guardian !== undefined ? String(row[map.guardian] || '').trim() : '',
      special: map.special !== undefined ? String(row[map.special] || '').trim() : ''
    };
    if (stu) {
      Object.assign(stu, data);
      updated++;
    } else {
      data.id = uid('stu');
      data.moralScore = 100;
      data.attendance = 100;
      data.extra = {};
      cls.students.push(data);
      created++;
    }
  }
  saveData();
  closeModal();
  openModal('导入结果', `
    <p>识别表头行：第 ${headerRow + 1} 行</p>
    <p>新建学生：<b>${created}</b> 人</p>
    <p>更新学生：<b>${updated}</b> 人</p>`, `
    <button class="btn" onclick="closeModal();renderStudents()">确定</button>`);
}
function importScores(rows) {
  const cls = getCurrentClass();
  if (!cls.exams.length) {
    closeModal();
    return toast('请先创建考试，再导入成绩');
  }
  // 默认导入到最新考试
  const exam = cls.exams[cls.exams.length - 1];
  const aliases = {
    name: ['姓名','学生姓名','名字'],
    classNo: ['学号','班内学号'],
    studentId: ['学籍号','学籍'],
    total: ['总分','总成绩']
  };
  const headerRow = findHeaderRow(rows, aliases);
  const headers = (rows[headerRow] || []).map(c => String(c || '').trim());
  const map = {};
  const subjectCols = {};
  headers.forEach((h, i) => {
    let matched = false;
    for (const [k, arr] of Object.entries(aliases)) {
      if (arr.includes(h)) { map[k] = i; matched = true; break; }
    }
    if (!matched && h && !['排名','班排','年级排名','校内排名','等级'].includes(h)) {
      subjectCols[h] = i;
    }
  });
  if (map.name === undefined) {
    closeModal();
    return toast('未识别到姓名列');
  }
  if (!cls.scores[exam.id]) cls.scores[exam.id] = {};
  let count = 0;
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[map.name]) continue;
    const name = String(row[map.name]).trim();
    let stu = cls.students.find(s => s.name === name);
    if (!stu) {
      // 自动建档
      stu = {
        id: uid('stu'), name, gender: '男', classNo: '', studentId: '',
        moralScore: 100, attendance: 100, extra: {}
      };
      if (map.classNo !== undefined) stu.classNo = String(row[map.classNo]||'').trim();
      cls.students.push(stu);
    }
    const sc = {};
    let total = 0, hasNum = false;
    for (const [sub, col] of Object.entries(subjectCols)) {
      const v = row[col];
      sc[sub] = v;
      const n = parseFloat(v);
      if (!isNaN(n)) { total += n; hasNum = true; }
    }
    if (map.total !== undefined && row[map.total] !== undefined && row[map.total] !== '') {
      sc.total = row[map.total];
    } else if (hasNum) {
      sc.total = total;
    }
    cls.scores[exam.id][stu.id] = sc;
    count++;
  }
  saveData();
  closeModal();
  openModal('成绩导入结果', `
    <p>考试：${exam.name}</p>
    <p>成功导入：<b>${count}</b> 条记录</p>
    <p>识别学科：${Object.keys(subjectCols).join('、') || '无'}</p>`, `
    <button class="btn" onclick="closeModal();viewExamScores('${exam.id}')">查看成绩</button>`);
}

/* ========== 导出中心 / 备份 ========== */
function showExportCenter() {
  openModal('导出中心', `
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" onclick="backupData();closeModal()">完整 JSON 备份</button>
      <button class="btn btn-outline" onclick="exportStudentsXlsx()">学生名单 (Excel/CSV)</button>
      <button class="btn btn-outline" onclick="switchModule('seats');closeModal()">座位表（在座位模块导出）</button>
    </div>`, `
    <button class="btn btn-outline" onclick="closeModal()">关闭</button>`);
}
function exportStudentsXlsx() {
  const cls = getCurrentClass();
  const data = [['学号','姓名','性别','学籍号','电话','特殊情况','德育分']];
  cls.students.forEach(s =>
    data.push([s.classNo, s.name, s.gender, s.studentId, s.phone, s.special, s.moralScore])
  );
  if (window.XLSX_LOADED) {
    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '学生名单');
    XLSX.writeFile(wb, `${cls.name}_学生名单.xlsx`);
    toast('已导出 Excel');
  } else {
    // CSV 降级（带 UTF-8 BOM，兼容 Excel 中文）
    let csv = '\uFEFF' + data.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${cls.name}_学生名单.csv`;
    a.click();
    toast('已导出 CSV（Excel可直接打开）');
  }
}
function backupData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `班主任工作台备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('备份已下载');
}
function restoreData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.classes || !data.currentClassId) throw new Error('无效备份文件');
      if (!confirm('确定用备份覆盖当前所有数据吗？')) return;
      appData = data;
      saveData();
      refreshClassSelect();
      switchModule('dashboard');
      toast('恢复成功');
    } catch (err) {
      toast('恢复失败：' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
function doGlobalSearch(kw) {
  if (!kw.trim()) return;
  _stuKeyword = kw.trim();
  switchModule('students');
}

/* ===== 初始化 ===== */
loadData();
refreshClassSelect();
switchModule('dashboard');
document.getElementById('modalMask').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
